name: Notify Google Chat on PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify-google-chat:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Google Chat
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO_NAME: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::GOOGLE_CHAT_WEBHOOK_URL secret is empty or not set"
            exit 1
          fi
          WEBHOOK_URL=$(printf '%s' "$WEBHOOK_URL" | tr -d '[:space:]')
          if ! [[ "$WEBHOOK_URL" == https://chat.googleapis.com/v1/spaces/* ]]; then
            echo "::error::GOOGLE_CHAT_WEBHOOK_URL does not look like a Google Chat webhook URL"
            exit 1
          fi

          PR_LINK_TEXT="<b><a href=\"${PR_URL}\">#${PR_NUMBER} ${PR_TITLE}</a></b>"
          BRANCH_TEXT="${HEAD_BRANCH} → ${BASE_BRANCH}"

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg num "$PR_NUMBER" \
            --arg author "$PR_AUTHOR" \
            --arg repo "$REPO_NAME" \
            --arg prLinkText "$PR_LINK_TEXT" \
            --arg branchText "$BRANCH_TEXT" \
            '{
              "cardsV2": [
                {
                  "cardId": "prNotificationCard",
                  "card": {
                    "header": {
                      "title": "New Pull Request",
                      "subtitle": $repo,
                      "imageUrl": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                      "imageType": "CIRCLE"
                    },
                    "sections": [
                      {
                        "widgets": [
                          {
                            "textParagraph": {
                              "text": $prLinkText
                            }
                          },
                          {
                            "decoratedText": {
                              "topLabel": "Author",
                              "text": $author
                            }
                          },
                          {
                            "decoratedText": {
                              "topLabel": "Branch",
                              "text": $branchText
                            }
                          },
                          {
                            "buttonList": {
                              "buttons": [
                                {
                                  "text": "Review PR",
                                  "onClick": {
                                    "openLink": {
                                      "url": $url
                                    }
                                  }
                                }
                              ]
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            }')

          curl -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
